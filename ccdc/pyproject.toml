[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ccdc-participating-resources-mcp"
version = "0.1.0"
description = "Read-only MCP server for CCDC participating resources"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccdc_mcp*"]

[tool.setuptools.package-data]
ccdc_mcp = ["assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
