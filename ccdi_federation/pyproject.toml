[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ccdi-federation-mcp"
version = "0.1.0"
description = "Public, read-only CCDI Federation metadata MCP server"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccdi_federation_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
