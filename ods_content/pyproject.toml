[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ccdi-ods-content-mcp"
version = "0.1.0"
description = "Read-only MCP server for NCI Data Sharing Hub Markdown pages"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ods_content_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
