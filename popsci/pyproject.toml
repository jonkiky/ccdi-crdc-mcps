[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "popsci-graphql-mcp"
version = "0.1.0"
description = "Read-only MCP server for Population Science GraphQL and PopSci model permissible values"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "graphql-core>=3.2,<4",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["popsci_mcp*"]

[tool.setuptools.package-data]
popsci_mcp = ["assets/*.yml", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
